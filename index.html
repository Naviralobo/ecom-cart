<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecommerce Grid Example</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="container">
      <!-- HEADER / NAVBAR -->
      <header class="header">
        <div class="logo">SHOP<span>NOW</span></div>
        <div class="cart-container">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="cart-count hidden">3</span>
        </div>
      </header>
      <main></main>

      <!-- FOOTER -->
      <footer class="footer">
        <div>© 2025 ShopNow. All Rights Reserved.</div>
        <div class="social">
          <a href="#">FB</a>
          <a href="#">IG</a>
          <a href="#">TW</a>
          <a href="www.google.com">G</a>
        </div>
        <div>
          <label for="emailSubscribe">Subscribe</label>
          <input
            type="text"
            id="emailSubscribe"
            placeholder="Enter your email"
            title="Subscribe to our emails"
          />
          <button>Subscribe</button>
        </div>
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
